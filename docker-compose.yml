services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: csp_user
      POSTGRES_PASSWORD: csp_local_password
      POSTGRES_DB: conscious_spending_plan
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U csp_user -d conscious_spending_plan"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
